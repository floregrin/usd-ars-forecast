name: Refresh FX forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 1-5'
permissions:
  contents: write
concurrency:
  group: fx-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LOG_MLFLOW: '0'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - run: pip install -r requirements-training.txt
      - name: Restore independent research quote archive
        uses: actions/cache@v4
        with:
          path: usd_ars.sqlite
          key: fx-research-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fx-research-v1-
      - name: Retrieve Yahoo quotes
        run: |
          python - <<'PY'
          import sqlite3
          import pandas as pd
          from usd_ars_worker import DDL, bootstrap, fetch, now
          with sqlite3.connect("usd_ars.sqlite") as db:
              db.executescript(DDL)
              stamp = now()
              if not db.execute("SELECT 1 FROM chunks WHERE name='initialized'").fetchone():
                  bootstrap(db, stamp)
              for interval, days in [('1h', 14), ('1m', 7)]:
                  fetch(db, stamp - pd.Timedelta(days=days), stamp, interval)
              latest = db.execute("SELECT MAX(bar_end) FROM prices").fetchone()[0]
              if latest is None or stamp - pd.Timestamp(latest, unit='s', tz='UTC') > pd.Timedelta(days=4):
                  raise RuntimeError("Quote archive is stale; refusing to publish")
              print("Latest quote:", pd.Timestamp(latest, unit='s', tz='UTC'))
              db.commit()
              db.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          PY
      - name: Execute final notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=5400 USD_ARS_Final.ipynb
      - name: Publish successful snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add USD_ARS_Final.ipynb tuned_config.json snapshot/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh FX research snapshot"
          git push origin HEAD:main
